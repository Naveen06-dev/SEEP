services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seep
      POSTGRES_PASSWORD: seep_secret
      POSTGRES_DB: seep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://seep:seep_secret@postgres:5432/seep?schema=public
      REDIS_URL: redis://redis:6379
      CODE_RUNNER_URL: http://code-runner:5001
      JWT_SECRET: dev-secret-change-in-prod
      CORS_ORIGIN: http://localhost:5173
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-runner:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: postgresql://seep:seep_secret@postgres:5432/seep?schema=public
      REDIS_URL: redis://redis:6379
      CODE_RUNNER_URL: http://code-runner:5001
    depends_on:
      - api
      - redis

  code-runner:
    build:
      context: ./code-runner
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      EXECUTION_TIMEOUT_MS: 5000
      EXECUTION_MEMORY_MB: 128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
