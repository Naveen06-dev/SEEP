<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>t_e Test Environment</title>
  <style>
    body {
      width: 280px;
      padding: 1.25rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #f3f4f6;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.1rem;
    }
    h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #fff;
    }
    .sub {
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 600;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.8rem;
      color: #9ca3af;
      margin: 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.off {
      background: rgba(255, 255, 255, 0.1);
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-box">🛡️</div>
    <div>
      <h2>t_e</h2>
      <div class="sub">Test Environment Extension</div>
    </div>
  </div>

  <div class="card">
    <span class="status-badge" id="statusBadge">🟢 t_e ON</span>
    <p id="statusMsg">All other browser extensions will be turned OFF automatically when an exam starts.</p>
  </div>

  <button id="toggleBtn">Turn ON t_e Exam Shield</button>

  <script src="popup.js"></script>
</body>
</html>
