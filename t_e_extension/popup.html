<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>t_e Security Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="icon-box">🛡️</div>
    <div>
      <h2>t_e</h2>
      <div class="sub">Test Environment Shield</div>
    </div>
  </div>

  <div class="card">
    <div class="status-badge" id="statusBadge">● Idle</div>
    <p id="statusMsg">All unauthorized browser extensions must be disabled before starting an exam.</p>
    
    <div class="info-row">
      <span>Unauthorized Extensions:</span>
      <strong id="unauthCount">0</strong>
    </div>
    <div class="info-row">
      <span>Exam Session:</span>
      <strong id="sessionStatus">Inactive</strong>
    </div>
  </div>

  <button id="refreshBtn">🔄 Refresh Security Status</button>

  <script src="popup.js"></script>
</body>
</html>
